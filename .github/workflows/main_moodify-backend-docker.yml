# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - moodify-backend-docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: moodifyregistry.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E9D31C829B4B4EE1AB41896727A0EFFC }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_4045088C491F4F7FA4DCFEBBA24BED32 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          push: true
          tags: moodifyregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E9D31C829B4B4EE1AB41896727A0EFFC }}/moodify-backend:${{ github.sha }}
          file: ./backend/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_10D331EB9C2140F39596442BF41F72E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6FE3499A51CF4013B8AE8E69AC03823C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E7D1E0BA1A114B7BA9FEF42DDB1146DD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'moodify-backend-docker'
          slot-name: 'Production'
          images: 'moodifyregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_E9D31C829B4B4EE1AB41896727A0EFFC }}/moodify-backend:${{ github.sha }}'
          
